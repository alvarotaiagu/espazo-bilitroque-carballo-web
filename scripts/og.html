<!doctype html><html lang="gl"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>
 *{box-sizing:border-box;margin:0}
 body{width:1200px;height:630px;background:#fff;font-family:Nunito,sans-serif;color:#1e2a44;
      display:grid;grid-template-columns:1.12fr .88fr;align-items:center;gap:30px;padding:64px 70px;overflow:hidden}
 .sup{font-family:Fredoka,sans-serif;font-weight:600;font-size:20px;letter-spacing:.3em;text-transform:uppercase;color:#5a6782;margin-bottom:12px}
 h1{font-family:Fredoka,sans-serif;font-weight:600;font-size:86px;line-height:.98;letter-spacing:-.02em;margin-bottom:18px}
 h1 .a{color:#1e2a44}
 h1 .b{color:#f28c28}
 p{font-size:25px;font-weight:700;color:#5a6782;line-height:1.3;max-width:20ch}
 .pil{display:flex;gap:10px;margin-top:26px;flex-wrap:wrap}
 .pil span{background:#f2f4f7;border-radius:999px;padding:9px 18px;font-size:19px;font-weight:800;display:flex;align-items:center;gap:8px}
 .pil i{width:11px;height:11px;border-radius:50%;display:block}
 .logo{display:grid;place-items:center}
 .logo img{width:430px;height:430px;object-fit:contain}
</style></head><body>
 <div>
  <div class="sup">Espazo de formación</div>
  <h1><span class="a">Espazo</span><br><span class="b">Bilitroque</span></h1>
  <p>Informática, robótica, programación e impresión 3D en Carballo.</p>
  <div class="pil">
   <span><i style="background:#f7d33d"></i>5,0 ★ · 5 reseñas</span>
   <span><i style="background:#2fa84f"></i>Luns a venres, 16–20 h</span>
   <span><i style="background:#2f80ed"></i>Rúa Perú, 14</span>
  </div>
 </div>
 <div class="logo"><img src="../assets/img/brand/bilitroque-logo.png" alt=""></div>
</body></html>
